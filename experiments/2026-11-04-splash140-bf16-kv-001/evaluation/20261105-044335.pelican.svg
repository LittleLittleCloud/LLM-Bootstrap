<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="400" fill="#e0f7fa" />
  
  <!-- Ground -->
  <rect x="0" y="350" width="400" height="50" fill="#81c784" />
  <line x1="0" y1="350" x2="400" y2="350" stroke="#388e3c" stroke-width="4" />

  <!-- Bicycle -->
  <g id="bicycle">
    <!-- Back Wheel -->
    <circle cx="100" cy="300" r="40" fill="none" stroke="#333" stroke-width="4" />
    <circle cx="100" cy="300" r="35" fill="none" stroke="#ccc" stroke-width="1" />
    <!-- Spokes Back -->
    <path d="M100 260 L100 340 M60 300 L140 300 M72 272 L128 328 M72 328 L128 272" stroke="#ccc" stroke-width="1" />
    
    <!-- Front Wheel -->
    <circle cx="300" cy="300" r="40" fill="none" stroke="#333" stroke-width="4" />
    <circle cx="300" cy="300" r="35" fill="none" stroke="#ccc" stroke-width="1" />
    <!-- Spokes Front -->
    <path d="M300 260 L300 340 M260 300 L340 300 M272 272 L328 328 M272 328 L328 272" stroke="#ccc" stroke-width="1" />

    <!-- Frame -->
    <path d="M100 300 L180 300 L140 220 L100 300" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" />
    <path d="M180 300 L280 220 L140 220" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" />
    <path d="M280 220 L300 300" fill="none" stroke="#d32f2f" stroke-width="5" />
    
    <!-- Handlebars -->
    <path d="M280 220 L270 190 L250 190" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round" />
    
    <!-- Seat -->
    <path d="M130 220 L150 220" fill="none" stroke="#555" stroke-width="4" />
    <ellipse cx="140" cy="215" rx="20" ry="8" fill="#333" />
    
    <!-- Pedals and Crank -->
    <circle cx="180" cy="300" r="10" fill="#555" />
    <line x1="180" y1="300" x2="160" y2="280" stroke="#555" stroke-width="4" />
    <line x1="180" y1="300" x2="200" y2="320" stroke="#555" stroke-width="4" />
    <rect x="150" y="275" width="20" height="10" fill="#333" rx="2" />
    <rect x="190" y="315" width="20" height="10" fill="#333" rx="2" />
  </g>

  <!-- Pelican -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="160" cy="160" rx="45" ry="35" fill="#fff" stroke="#ddd" stroke-width="2" />
    
    <!-- Neck -->
    <path d="M180 140 Q200 100 190 70" fill="none" stroke="#fff" stroke-width="25" stroke-linecap="round" />
    <path d="M180 140 Q200 100 190 70" fill="none" stroke="#eee" stroke-width="23" stroke-linecap="round" />
    
    <!-- Head -->
    <circle cx="190" cy="65" r="20" fill="#fff" />
    
    <!-- Beak (Upper) -->
    <path d="M205 60 L260 65 L205 75 Z" fill="#ffb74d" />
    
    <!-- Beak (Lower/Pouch) -->
    <path d="M205 75 L250 78 L205 85 Z" fill="#ffcc80" />
    
    <!-- Eye -->
    <circle cx="195" cy="60" r="3" fill="#000" />
    <circle cx="196" cy="59" r="1" fill="#fff" />
    
    <!-- Wing (Holding Handlebars) -->
    <path d="M170 150 Q220 160 260 190" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" />
    <path d="M170 150 Q220 160 260 190" fill="none" stroke="#eee" stroke-width="8" stroke-linecap="round" />
    
    <!-- Legs -->
    <!-- Left Leg (Back) -->
    <path d="M150 190 L160 240 L160 280" fill="none" stroke="#ffb74d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M150 280 L170 280" fill="none" stroke="#ffb74d" stroke-width="6" stroke-linecap="round" />
    
    <!-- Right Leg (Front) -->
    <path d="M170 190 L180 240 L190 280" fill="none" stroke="#ffb74d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M180 280 L200 280" fill="none" stroke="#ffb74d" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>