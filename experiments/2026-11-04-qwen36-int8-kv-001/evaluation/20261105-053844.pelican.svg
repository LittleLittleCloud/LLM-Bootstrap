<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="400" fill="#e0f7fa" />
  
  <!-- Ground -->
  <rect x="0" y="350" width="400" height="50" fill="#81c784" />
  <line x1="0" y1="350" x2="400" y2="350" stroke="#4caf50" stroke-width="4" />

  <!-- Bicycle -->
  <g id="bicycle">
    <!-- Back Wheel -->
    <circle cx="100" cy="300" r="40" fill="none" stroke="#333" stroke-width="4" />
    <circle cx="100" cy="300" r="35" fill="none" stroke="#ccc" stroke-width="1" />
    <line x1="100" y1="260" x2="100" y2="340" stroke="#ccc" stroke-width="1" />
    <line x1="60" y1="300" x2="140" y2="300" stroke="#ccc" stroke-width="1" />
    
    <!-- Front Wheel -->
    <circle cx="300" cy="300" r="40" fill="none" stroke="#333" stroke-width="4" />
    <circle cx="300" cy="300" r="35" fill="none" stroke="#ccc" stroke-width="1" />
    <line x1="300" y1="260" x2="300" y2="340" stroke="#ccc" stroke-width="1" />
    <line x1="260" y1="300" x2="340" y2="300" stroke="#ccc" stroke-width="1" />

    <!-- Frame -->
    <path d="M100 300 L180 300 L140 220 L100 300" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" />
    <path d="M180 300 L280 220 L140 220" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" />
    <path d="M280 220 L300 300" fill="none" stroke="#d32f2f" stroke-width="5" />
    
    <!-- Handlebars -->
    <path d="M280 220 L270 190 L250 190" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" />
    
    <!-- Seat -->
    <path d="M130 220 L150 220" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" />
    <ellipse cx="140" cy="215" rx="20" ry="8" fill="#333" />
    
    <!-- Pedals and Crank -->
    <circle cx="180" cy="300" r="10" fill="#555" />
    <line x1="180" y1="300" x2="160" y2="280" stroke="#555" stroke-width="4" stroke-linecap="round" />
    <line x1="180" y1="300" x2="200" y2="320" stroke="#555" stroke-width="4" stroke-linecap="round" />
    <rect x="150" y="275" width="20" height="10" fill="#333" rx="2" />
    <rect x="190" y="315" width="20" height="10" fill="#333" rx="2" />
  </g>

  <!-- Pelican -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="160" cy="160" rx="45" ry="55" fill="#fff" stroke="#ddd" stroke-width="2" transform="rotate(-10 160 160)" />
    
    <!-- Wing -->
    <path d="M130 150 Q180 180 190 130 Q160 120 130 150" fill="#f5f5f5" stroke="#ccc" stroke-width="2" />
    
    <!-- Neck -->
    <path d="M180 130 Q200 100 190 70" fill="none" stroke="#fff" stroke-width="25" stroke-linecap="round" />
    
    <!-- Head -->
    <circle cx="190" cy="60" r="20" fill="#fff" />
    
    <!-- Beak (Upper) -->
    <path d="M205 55 L260 65 L205 70 Z" fill="#ffb74d" />
    
    <!-- Beak (Lower/Pouch) -->
    <path d="M205 70 L250 75 L210 85 Z" fill="#ffcc80" />
    
    <!-- Eye -->
    <circle cx="195" cy="55" r="3" fill="#000" />
    <circle cx="196" cy="54" r="1" fill="#fff" />
    
    <!-- Legs -->
    <!-- Left Leg (Back) -->
    <line x1="150" y1="200" x2="160" y2="280" stroke="#ffb74d" stroke-width="6" stroke-linecap="round" />
    <line x1="160" y1="280" x2="150" y2="290" stroke="#ffb74d" stroke-width="6" stroke-linecap="round" />
    
    <!-- Right Leg (Front) -->
    <line x1="170" y1="200" x2="160" y2="280" stroke="#ffb74d" stroke-width="6" stroke-linecap="round" />
    <line x1="160" y1="280" x2="170" y2="290" stroke="#ffb74d" stroke-width="6" stroke-linecap="round" />
    
    <!-- Arms/Wings holding handlebars -->
    <path d="M170 140 Q220 160 250 190" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" />
    <path d="M170 140 Q220 160 250 190" fill="none" stroke="#eee" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>