name: Validate plugin package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked repository-check dependencies
        run: npm ci
      - name: Check plugin formats, bundled resources, and protocol schemas
        run: npm test
      - name: Check whitespace
        run: git diff --check